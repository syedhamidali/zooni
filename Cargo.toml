[package]
name = "zooni"
version = "2026.4.23"
edition = "2024"
description = "Autonomous algorithmic trading bot with grid strategies, market intelligence, and multi-venue support"
authors = ["Hamid Ali Syed <hamidrixvi@gmail.com>"]
repository = "https://github.com/syedhamidali/zooni"
homepage = "https://github.com/syedhamidali/zooni"
license = "MIT"
keywords = ["trading", "algorithmic-trading", "grid-trading", "crypto", "bybit"]
categories = ["finance", "command-line-utilities"]
rust-version = "1.85"
readme = "README.md"

[[bin]]
name = "zooni"
path = "src/main.rs"

[[bin]]
name = "zooni-backtest"
path = "src/bin/backtest.rs"

[[bin]]
name = "zooni-scan"
path = "src/bin/scan.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
toml = "0.8"
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
crossterm = "0.27"
ratatui = "0.26"
axum = "0.7"
tower = "0.4"
