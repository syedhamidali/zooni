name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: Auto-format
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Run cargo fmt
        run: cargo fmt --all
      - name: Commit formatting fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "style: auto-format with cargo fmt"
          git push

  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    needs: [fmt]
    if: always() && !cancelled()
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [fmt]
    if: always() && !cancelled()
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --all

  build:
    name: Build Release
    runs-on: ubuntu-latest
    needs: [check, test]
    if: always() && !cancelled() && needs.check.result == 'success' && needs.test.result == 'success'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build release binaries
        run: cargo build --release --all-targets

      - name: Upload binaries
        uses: actions/upload-artifact@v6
        with:
          name: zooni-linux-x86_64
          path: |
            target/release/zooni
            target/release/zooni-backtest
            target/release/zooni-scan
            target/release/zooni-optimize
            target/release/zooni-report

  release:
    name: Auto-Release
    runs-on: ubuntu-latest
    needs: [build]
    if: always() && !cancelled() && needs.build.result == 'success' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate version tag
        id: version
        run: |
          VERSION=$(date +"%Y.%-m.%-d")
          TAG="v${VERSION}.${GITHUB_RUN_NUMBER}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: zooni-linux-x86_64
          path: artifacts/

      - name: Make binaries executable
        run: chmod +x artifacts/zooni artifacts/zooni-backtest artifacts/zooni-scan artifacts/zooni-optimize artifacts/zooni-report

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Zooni ${{ steps.version.outputs.tag }}"
          files: |
            artifacts/zooni
            artifacts/zooni-backtest
            artifacts/zooni-scan
            artifacts/zooni-optimize
            artifacts/zooni-report
          generate_release_notes: true
