# Trading Bot — example config.
# Copy to `config.toml` and fill in your credentials.
# DO NOT commit config.toml (it contains secrets).

# ─────────────────────────────────────────────────────────────────────────────
# Bot-level settings
# ─────────────────────────────────────────────────────────────────────────────
[bot]
dry_run       = false          # true = simulate orders, no exchange calls
db_path       = "trading-bot.db"  # SQLite database for order journal + P&L
max_retries   = 3              # retries per API call (exponential backoff)
circuit_breaker_threshold = 5  # consecutive failures before pausing
circuit_breaker_cooldown_secs = 60
shutdown_wait_secs = 10        # seconds to wait for in-flight orders at shutdown

# ─────────────────────────────────────────────────────────────────────────────
# Bybit credentials
# ─────────────────────────────────────────────────────────────────────────────
[bybit]
api_key        = "YOUR_API_KEY"
api_secret     = "YOUR_API_SECRET"
testnet        = true          # true = use testnet endpoints
recv_window_ms = 5000
account_type   = "UNIFIED"

# ─────────────────────────────────────────────────────────────────────────────
# Zerodha Kite Connect (optional — for Indian equity, F&O, MCX)
# ─────────────────────────────────────────────────────────────────────────────
# [zerodha]
# api_key      = "YOUR_KITE_API_KEY"
# api_secret   = "YOUR_KITE_API_SECRET"
# access_token = ""  # refreshed daily via login flow; can be set at runtime

# ─────────────────────────────────────────────────────────────────────────────
# Grid strategy
# ─────────────────────────────────────────────────────────────────────────────
[grid]
symbol             = "BTCUSDT"
lower_price        = 60000.0
upper_price        = 90000.0
levels             = 20        # more levels = tighter spacing = more trades
qty_per_level_base = 0.001     # base asset per grid line (e.g., BTC)
poll_secs          = 3         # reconciliation polling interval
cancel_existing_on_start = true

# Dynamic grid rebalancing: shift grid when price nears the edge
auto_rebalance = false

# Trailing profit: threshold in quote currency (0 = disabled)
trailing_profit_threshold = 0.0

# ─────────────────────────────────────────────────────────────────────────────
# Risk management
# ─────────────────────────────────────────────────────────────────────────────
[risk]
starting_equity_quote = 10000.0   # USDT — set to your actual balance
max_total_exposure    = 0.80      # 80% of equity
max_per_market        = 0.40
max_per_symbol        = 0.20
max_per_strategy      = 0.15
daily_loss_limit      = 0.05      # 5% daily loss → pause
weekly_loss_limit     = 0.10      # 10% weekly loss → pause
max_drawdown          = 0.15      # 15% drawdown from peak → pause

# ─────────────────────────────────────────────────────────────────────────────
# Alerts (optional — omit section to disable)
# ─────────────────────────────────────────────────────────────────────────────
[alerts]
# Slack incoming webhook, Discord webhook, or any HTTP POST endpoint
# webhook_url = "https://hooks.slack.com/services/T.../B.../..."
on_fill         = false     # alert on every fill (can be noisy)
on_risk_breach  = true      # alert when risk limits hit
on_lifecycle    = true      # alert on startup/shutdown
on_error        = true      # alert on API errors
pnl_summary_interval_secs = 3600  # hourly P&L summary (0 = disabled)

# ─────────────────────────────────────────────────────────────────────────────
# Auto-pilot mode (optional)
# When enabled, the bot autonomously scans markets, picks the best symbol(s),
# configures grid parameters, sizes positions, and switches when better
# opportunities appear. The [grid] section is ignored in this mode.
# ─────────────────────────────────────────────────────────────────────────────
[autopilot]
enabled             = false     # true = fully autonomous mode
scan_interval_secs  = 1800      # re-scan every 30 minutes
switch_threshold    = 15.0      # score improvement needed to switch symbols
max_grids           = 1         # number of simultaneous grids (symbols)

[autopilot.scanner]
min_turnover        = 1000000.0   # minimum 24h turnover in USDT
max_spread_pct      = 0.2         # maximum bid-ask spread %
quote_currencies    = ["USDT"]    # which quote currencies to scan
max_results         = 10          # top N candidates to analyze
kline_interval      = "60"        # candlestick interval (minutes)
kline_count         = 200         # candles to fetch for regime analysis

# ─────────────────────────────────────────────────────────────────────────────
# Funding Rate Arbitrage (optional — run with `--funding-arb`)
# Delta-neutral carry trade: long spot + short perpetual, collect funding.
# ─────────────────────────────────────────────────────────────────────────────
# [funding_arb]
# entry_threshold          = 0.0001    # min funding rate to enter (0.01% per 8h)
# exit_threshold           = -0.00005  # exit when rate drops below this
# min_turnover             = 5000000.0 # min 24h turnover in USDT
# max_position_pct         = 0.15      # max fraction of equity per position
# leverage                 = 1         # perp leg leverage (1 = no leverage)
# max_positions            = 3         # max simultaneous positions
# min_positive_intervals   = 3         # min consecutive positive funding periods
# max_unrealised_loss_pct  = 0.02      # force-exit if unrealised loss > 2%
# scan_interval_secs       = 300       # check rates every 5 minutes

# ─────────────────────────────────────────────────────────────────────────────
# Tax-aware profitability (optional — defaults to no tax for international)
# For Indian market trading, set jurisdiction = "india" so the bot only enters
# trades that are profitable AFTER 30% crypto tax + 1% TDS + fees.
# ─────────────────────────────────────────────────────────────────────────────
# [tax]
# jurisdiction       = "none"    # "india" or "none"
# crypto_tax_rate    = 0.30      # 30% flat tax on crypto gains (India)
# crypto_tds_rate    = 0.01      # 1% TDS on every crypto sale (India)
# equity_stcg_rate   = 0.15      # 15% short-term capital gains (equity, India)
# equity_ltcg_rate   = 0.10      # 10% long-term capital gains (equity, India)
# trading_fee_rate   = 0.001     # brokerage + exchange fees per leg

# ─────────────────────────────────────────────────────────────────────────────
# Slippage protection (optional — sensible defaults applied)
# Guards against adverse fills during volatile moments.
# ─────────────────────────────────────────────────────────────────────────────
# [slippage]
# max_slippage_pct     = 0.005   # reject fills with > 0.5% slippage
# prefer_limit_orders  = true    # convert market orders to aggressive limits
# limit_offset_pct     = 0.001   # aggressive limit offset (0.1% from current)
